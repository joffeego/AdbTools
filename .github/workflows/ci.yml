name: CI

# Runs on every push to main and every pull request. Until now the only workflow
# was the release build, which means nothing was checked until a tag was pushed -
# a change could break the build, or the core logic, for days without anyone
# noticing.
#
# This does NOT touch signing or publishing: it only compiles the app and runs
# the core unit tests.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + core tests (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
          update: true

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      # Build the app first: if the GUI half no longer compiles, a green test
      # suite would be misleading.
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Run core unit tests
        shell: msys2 {0}
        env:
          # Per-assertion breadcrumb (file:line). The harness writes it to
          # stderr, flushed, so if a case aborts the process the last line names
          # the exact assertion that was running - which is otherwise impossible
          # to determine from a std::bad_alloc abort.
          ADBTOOLS_TEST_TRACE: '1'
        run: |
          cd build
          # -LE device: the device end-to-end tests need a real phone and self-skip
          # without one. Excluding them by label (rather than relying on the skip)
          # keeps a future failure from hiding behind "no device connected" - and
          # they are run explicitly on a developer machine.
          ctest --output-on-failure -LE device 2>&1

      # Runs the binary directly as well: a crash inside one case (e.g. a
      # std::bad_alloc) can abort the process under ctest without printing the
      # per-case detail, and this is the step that then shows which case it was.
      - name: Run tests directly
        if: always()
        shell: msys2 {0}
        run: ./build/adbtools_tests.exe 2>&1 || echo "direct run failed (see above)"

  # Keeps the "pure logic" half honest: core/ must stay free of GUI and app
  # state, which is what makes it testable at all. Runs on Linux on purpose:
  # there, a stray <windows.h> or eui include is unambiguously wrong, and the
  # standalone compile genuinely exercises the "no framework needed" property.
  # (On Windows, sha256.cpp legitimately includes <windows.h> under #ifdef
  # _WIN32 for CNG hashing - the only documented platform dependency.)
  core-purity:
    name: core/ stays GUI-free
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: core/ must not include the UI framework; platform headers only where documented
        run: |
          set -uo pipefail
          status=0

          if grep -rn --include='*.cpp' --include='*.h' -E 'eui_neo\.h|"eui/|<eui/|glfw' core/; then
            echo "::error::core/ must not include the UI framework (see core/README.md)"
            status=1
          fi

          # Four files are allowed a platform header, each for a documented
          # reason: sha256 (CNG hashing), process (CreateProcess/pipes), adbpath
          # (GetModuleFileNameW) and fileio (GetFileAttributesW, used to answer
          # "is this a regular file?" without constructing a std::filesystem::path
          # - see core/fileio.h for why that matters). Everything else must be
          # portable, and each of the four must guard its include with
          # #ifdef _WIN32 so core/ still builds on the Linux job.
          allowed='^(core/sha256\.cpp|core/process\.cpp|core/adbpath\.cpp|core/fileio\.cpp):'
          offenders=$(grep -rn --include='*.cpp' --include='*.h' '#include <windows.h>' core/ \
                        | grep -vE "$allowed" || true)
          if [ -n "$offenders" ]; then
            echo "::error::only sha256.cpp, process.cpp, adbpath.cpp and fileio.cpp may include <windows.h>"
            echo "$offenders"
            status=1
          fi

          for f in core/sha256.cpp core/process.cpp core/adbpath.cpp core/fileio.cpp; do
            if ! grep -q '#ifdef _WIN32' "$f"; then
              echo "::error::$f must guard its Windows include with #ifdef _WIN32"
              status=1
            fi
          done

          if [ "$status" -eq 0 ]; then
            echo "core/ is free of GUI includes; each platform dependency is documented and guarded."
          fi
          exit $status

      - name: core/ must compile standalone (no framework, -Wall -Wextra)
        run: |
          set -euo pipefail
          # -Werror makes the warning budget explicit: core/ currently compiles
          # warning-free, and it should stay that way.
          for f in core/*.cpp; do
            echo "compiling $f"
            g++ -std=c++17 -Wall -Wextra -Werror -I. -fsyntax-only "$f"
          done
          echo "core/ compiles standalone from its own headers only."
