name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
          update: true

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Fetch scrcpy + adb
        shell: pwsh
        run: ./scripts/fetch_scrcpy.ps1 -Version latest -OutDir build/scrcpy

      - name: Set version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -like 'v*') { $v = $v.Substring(1) }
          if (-not $v) { $v = "0.0.0" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: |
          set "PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6"
          iscc installer.iss /DMyAppVersion=%APP_VERSION%

      - name: Assemble portable package
        shell: pwsh
        run: |
          $dist = "dist/AdbFileBrowser-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build/adb_browser.exe" $dist/ -Force
          Copy-Item -Recurse "build/assets"      "$dist/assets" -Force
          Copy-Item -Recurse "build/scrcpy"      "$dist/scrcpy" -Force
          Copy-Item "LICENSE"                    $dist/ -Force
          Copy-Item "THIRD_PARTY_NOTICES.md"     $dist/ -Force
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/AdbFileBrowser-windows-x64.zip" -Force

      # Publish a "sha256sum"-style sidecar next to every release asset: the
      # in-app updater (and the app's own self-update) verifies the download
      # against "<asset>.sha256" before it replaces anything on disk.
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem "dist/AdbFileBrowser-windows-x64.zip", "dist/AdbTools-Setup-*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            $line = "$hash  $($_.Name)"
            Set-Content -Path "$($_.FullName).sha256" -Value $line -Encoding ascii -NoNewline
            Add-Content -Path "$($_.FullName).sha256" -Value "`n" -NoNewline
            Write-Host "  $line"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdbFileBrowser-windows-x64
          path: |
            dist/AdbFileBrowser-windows-x64.zip
            dist/AdbTools-Setup-*.exe
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdbFileBrowser-windows-x64.zip
            dist/AdbTools-Setup-*.exe
            dist/*.sha256
          generate_release_notes: true
