name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Code signing is OPTIONAL and off by default.
#
# The "Set up signing" step below enables it only when both repository secrets
# exist, so this workflow builds and publishes completely unsigned releases
# unless you deliberately configure signing:
#
#   Settings -> Secrets and variables -> Actions
#     SIGNPATH_API_TOKEN        API token of a SignPath user with submitter rights
#     SIGNPATH_ORGANIZATION_ID  SignPath organization id (GUID)
#
# Optional variables - only needed if you named things differently in SignPath:
#   SIGNPATH_PROJECT_SLUG         (default: adbtools)
#   SIGNPATH_SIGNING_POLICY_SLUG  (default: release-signing)
#   SIGNPATH_ARTIFACT_CONFIG_SLUG (default: adbtools-release)
#     (.signpath/artifact-configuration.xml is the source of truth for that
#      configuration; paste it into SignPath whenever it changes)
#
# Why SignPath and what it buys: signing is what removes the Windows "unknown
# publisher" / SmartScreen warning and starts building Defender reputation.
# See the maintenance guide, section "杀毒软件误报".
#
# Signing uses SignPath's GitHub trusted build system connector; the Open
# Source Code Signing edition requires origin verification, which means the
# SignPath GitHub App must be installed on this repo and every job leading up
# to a signing request must run on GitHub-hosted runners (satisfied below).
# ---------------------------------------------------------------------------

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            "SIGNPATH_ENABLED=true" >> $env:GITHUB_ENV
            Write-Host "SignPath credentials found - release artifacts will be Authenticode-signed."
          } else {
            "SIGNPATH_ENABLED=false" >> $env:GITHUB_ENV
            Write-Host "::notice title=Unsigned release::SignPath secrets are not configured, so this release will ship unsigned. See .github/workflows/release.yml for setup."
          }

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
          update: true

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Fetch scrcpy + adb
        shell: pwsh
        env:
          # The script queries api.github.com to resolve "latest". Unauthenticated
          # requests are rate limited per IP and hosted runners share IPs, which
          # made this step fail with "API rate limit exceeded".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch_scrcpy.ps1 -Version latest -OutDir build/scrcpy

      - name: Set version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -like 'v*') { $v = $v.Substring(1) }
          if (-not $v) { $v = "0.0.0" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------------
      # Optional signing pass 1: the main executable, signed BEFORE it is
      # packaged. The portable ZIP then distributes this signed binary and iscc
      # embeds it into the (separately signed) installer, so one signing request
      # covers both packages.
      # ---------------------------------------------------------------------
      - name: Upload unsigned adb_browser.exe
        id: upload-unsigned-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adb_browser-unsigned
          path: build/adb_browser.exe
          if-no-files-found: error

      - name: Submit adb_browser.exe for signing
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG || ''adbtools'' }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || ''release-signing'' }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || ''adbtools-release'' }}'
          github-artifact-id: '${{ steps.upload-unsigned-exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'build'
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}
            file-name: "adb_browser.exe"

      - name: Verify the executable signature
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "build/adb_browser.exe"
          "Status : $($sig.Status)"
          "Signer : $($sig.SignerCertificate.Subject)"
          "Issuer : $($sig.SignerCertificate.Issuer)"
          if ($sig.Status -ne 'Valid') { throw "adb_browser.exe is not validly signed ($($sig.Status))" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: |
          set "PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6"
          iscc installer.iss /DMyAppVersion=%APP_VERSION%

      # The version resource is the only thing that can be verified about these
      # binaries - they are unsigned, and the installer only gained a VERSIONINFO
      # block in 0.10.12. Assert it from the tag: a stale adb_browser.rc or a
      # missing VersionInfo* directive in installer.iss used to ship silently
      # (0.9.x), which makes the build lie about itself and is also the shape
      # heuristic AV engines dislike.
      #
      # .Trim() on the values is not cosmetic: FileSystemInfo.VersionInfo pads
      # FileVersion to a fixed width ("0.10.12.0      "), which is exactly how the
      # first version of this assertion failed on the v0.10.12 tag.
      - name: Assert the binaries carry the tag version
        shell: pwsh
        run: |
          $expected = "$env:APP_VERSION.0"
          $app = (Get-Item "build/adb_browser.exe").VersionInfo
          "adb_browser.exe  FileVersion='$($app.FileVersion)'  ProductVersion='$($app.ProductVersion)'"
          if ($app.FileVersion.Trim() -ne $expected) {
            throw "adb_browser.exe FileVersion is '$($app.FileVersion.Trim())', expected '$expected' - check adb_browser.rc / core/appinfo.h"
          }
          foreach ($setup in Get-ChildItem "dist/AdbTools-Setup-*.exe") {
            $vi = $setup.VersionInfo
            "  $($setup.Name)  FileVersion='$($vi.FileVersion)'  ProductName='$($vi.ProductName)'"
            if ($vi.FileVersion.Trim() -ne $expected) {
              throw "$($setup.Name) FileVersion is '$($vi.FileVersion.Trim())', expected '$expected' - check the VersionInfo* directives in installer.iss"
            }
          }

      # ---------------------------------------------------------------------
      # Optional signing pass 2: the installer package itself.
      # ---------------------------------------------------------------------
      - name: Upload unsigned installer
        id: upload-unsigned-setup
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AdbTools-Setup-unsigned
          path: dist/AdbTools-Setup-*.exe
          if-no-files-found: error

      - name: Submit installer for signing
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        env:
          SETUP_FILE_NAME: AdbTools-Setup-${{ env.APP_VERSION }}.exe
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG || ''adbtools'' }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || ''release-signing'' }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || ''adbtools-release'' }}'
          github-artifact-id: '${{ steps.upload-unsigned-setup.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist'
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}
            file-name: ${{ toJSON(env.SETUP_FILE_NAME) }}

      - name: Verify the installer signature
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist/AdbTools-Setup-*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup.FullName
          "File   : $($setup.Name)"
          "Status : $($sig.Status)"
          "Signer : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "$($setup.Name) is not validly signed ($($sig.Status))" }

      # ---------------------------------------------------------------------
      # Two packages, on purpose.
      #
      # adb.exe, AdbWinApi.dll, scrcpy.exe and the FFmpeg/SDL DLLs are unsigned
      # third-party binaries. Bundling them inside our archive is what gets the
      # whole release flagged by antivirus products - and Windows Defender
      # reports the *archive*, not the offending member, so the detection looks
      # like it is on this program. They are therefore shipped as a separate
      # optional package, and the app downloads adb (and scrcpy, for mirroring) on
      # demand from the official sources, verifying the published checksums.
      #
      # The application package also must not gain any other DLL dependency: the
      # 0.10.0 build silently needed libcurl-4.dll (the MSYS2 cmake package pulls
      # libcurl into /mingw64, and the framework links it when CMake finds it),
      # so installing on a machine without MSYS2 failed with a missing-DLL error.
      # CMakeLists.txt now disables that search and cmake/check_pe_imports.cmake
      # fails the build above if any non-system DLL creeps in.
      # ---------------------------------------------------------------------
      - name: Assemble the portable application package
        shell: pwsh
        run: |
          $app = "dist/AdbFileBrowser-windows-x64"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "build/adb_browser.exe" $app/ -Force
          Copy-Item -Recurse "build/assets"  "$app/assets" -Force
          Copy-Item "LICENSE"                $app/ -Force
          Copy-Item "THIRD_PARTY_NOTICES.md" $app/ -Force
          Compress-Archive -Path "$app/*" -DestinationPath "dist/AdbFileBrowser-windows-x64.zip" -Force

      - name: Assemble the optional adb/scrcpy tools package
        shell: pwsh
        run: |
          # Extracts into the application directory as scrcpy\..., which is exactly
          # where findAdb() and findScrcpy() look.
          $tools = "dist/tools/AdbTools-tools-windows-x64"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item -Recurse "build/scrcpy" "$tools/scrcpy" -Force
          Copy-Item "THIRD_PARTY_NOTICES.md" $tools/ -Force
          Compress-Archive -Path "$tools/scrcpy", "$tools/THIRD_PARTY_NOTICES.md" `
                           -DestinationPath "dist/AdbTools-tools-windows-x64.zip" -Force

      # The split above is the whole point of this release, so assert it rather
      # than trust the copy list.
      - name: Assert the application package carries no third-party binaries
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/AdbFileBrowser-windows-x64.zip"))
          try {
            # Normalise separators: Compress-Archive writes '\' on Windows
            # PowerShell 5.1 and '/' on PowerShell 7.
            $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            $binaries = $names | Where-Object { $_ -match '\.(exe|dll|sys|jar)$' }
            Write-Host "Executables in the application package: $($binaries -join ', ')"
            if ($names -notcontains 'adb_browser.exe') {
              throw "adb_browser.exe is missing from the application package"
            }
            $foreign = $binaries | Where-Object { $_ -ne 'adb_browser.exe' }
            if ($foreign) {
              throw "The application package must contain only adb_browser.exe; found: $($foreign -join ', ')"
            }
            Write-Host "OK: the application package contains no third-party binaries."
          } finally {
            $zip.Dispose()
          }

      - name: Assert the tools package carries adb and scrcpy
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/AdbTools-tools-windows-x64.zip"))
          try {
            # Normalise separators: Compress-Archive writes '\' on Windows
            # PowerShell 5.1 and '/' on PowerShell 7, and the assertion should not
            # depend on which one the runner happens to use.
            $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            # The paths matter: these are what core::findAdb() and findScrcpy()
            # resolve relative to the executable directory.
            foreach ($required in 'scrcpy/adb.exe', 'scrcpy/scrcpy.exe') {
              if ($names -notcontains $required) { throw "$required is missing from the tools package" }
            }
            Write-Host "OK: the tools package contains adb.exe and scrcpy.exe at the expected paths."
          } finally {
            $zip.Dispose()
          }

      # Checksums are generated last: attaching a signature changes the bytes of
      # every executable, so anything computed before signing would be stale.
      # The in-app updater verifies downloads against these (GitHub's asset
      # "digest", or the "<asset>.sha256" sidecar published below).
      - name: Generate checksums
        shell: pwsh
        run: |
          $artifacts = @(
            "dist/AdbFileBrowser-windows-x64.zip"
            "dist/AdbTools-tools-windows-x64.zip"
          )
          $artifacts += (Get-ChildItem "dist/AdbTools-Setup-*.exe" | ForEach-Object { $_.FullName })
          foreach ($path in $artifacts) {
            $item = Get-Item $path
            $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLower()
            $line = "$hash  $($item.Name)"
            Set-Content -Path "$($item.FullName).sha256" -Value $line -Encoding ascii -NoNewline
            Add-Content -Path "$($item.FullName).sha256" -Value "`n" -NoNewline
            Write-Host "  $line"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdbFileBrowser-windows-x64
          path: |
            dist/AdbFileBrowser-windows-x64.zip
            dist/AdbTools-tools-windows-x64.zip
            dist/AdbTools-Setup-*.exe
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdbFileBrowser-windows-x64.zip
            dist/AdbTools-tools-windows-x64.zip
            dist/AdbTools-Setup-*.exe
            dist/*.sha256
          generate_release_notes: true
          append_body: true
          body: |
            ## 下哪个文件？

            | 文件 | 说明 |
            | --- | --- |
            | `AdbTools-Setup-<版本>.exe` | **推荐**。安装包，含中文向导、开始菜单/桌面快捷方式。 |
            | `AdbFileBrowser-windows-x64.zip` | 免安装版，解压即用。 |
            | `AdbTools-tools-windows-x64.zip` | **可选**。adb + scrcpy（投屏用）。需要离线自带工具时再下，解压到程序目录即可。 |

            主程序包里**不含** adb / scrcpy：这两个是第三方二进制，一起打包会让杀毒软件
            把整个压缩包报成病毒。程序在需要时会自己从官方源下载并校验，所以不装这个
            可选包也能正常用。每个文件旁的 `.sha256` 是它的 SHA-256 校验值。

